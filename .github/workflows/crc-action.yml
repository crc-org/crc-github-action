name: crc-action

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: palmsoftware/quick-cleanup@v0
        with:
          cleanup-mode: aggressive

      - name: Check out code
        uses: actions/checkout@v4

      - name: CRC Action
        uses: ./
        with:
          cpus: 4
          memory: 6098
          disk: 40
